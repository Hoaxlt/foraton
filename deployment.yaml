apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: zil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.19.2
        ports:
          containerPort: 80
